name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv lock --check
      - run: uv sync --locked --extra all --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy packages
      - run: uv run pytest tests
      - run: uv build --no-sources
      - name: Verify the source-free aggregate Wheel
        run: |
          uv venv "${RUNNER_TEMP}/tributo-algorithms-source-free"
          uv pip install \
            --python "${RUNNER_TEMP}/tributo-algorithms-source-free/bin/python" \
            dist/tributo_algorithms-*.whl
          "${RUNNER_TEMP}/tributo-algorithms-source-free/bin/python" \
            scripts/verify_installed_distribution.py \
            --distribution tributo-algorithms \
            --expected-entry-points 37 \
            --expected-exporters 9 \
            --expected-validators 1 \
            --expected-model-flavors 3 \
            --expected-extras all boosting catboost causal-core causal-discovery causal-dowhy \
              causal-dr causal-xlearner classical graph-pyg multistage-torch recsys-torch \
              representation tabular-torch timeseries transformers-nlp \
            --require-scalar-single-column-binding

  xgboost-single-node-smoke:
    name: XGBoost single-node Ray Jobs smoke
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the aggregate Wheel and export its locked runtime
        run: |
          uv lock --check
          uv build --no-sources
          uv export \
            --locked \
            --extra boosting \
            --no-dev \
            --no-emit-project \
            --no-annotate \
            --output-file dist/xgboost-smoke-requirements.txt
      - name: Run the installed Wheel through a single-node Ray Jobs cluster
        run: bash tests/jobs/run_xgboost_single_node_smoke.sh
      - name: Preserve XGBoost smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-single-node-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tributo-xgboost-single-node-smoke-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
          retention-days: 14


  xlearner-single-node-smoke:
    name: X-Learner single-node Ray Jobs smoke
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the aggregate Wheel and export its locked runtime
        run: |
          uv lock --check
          uv build --no-sources
          uv export \
            --locked \
            --extra causal-xlearner \
            --no-dev \
            --no-emit-project \
            --no-annotate \
            --output-file dist/xlearner-smoke-requirements.txt
      - name: Run the installed Wheel through a single-node Ray Jobs cluster
        run: bash tests/jobs/run_xlearner_single_node_smoke.sh
      - name: Preserve X-Learner smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xlearner-single-node-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tributo-xlearner-single-node-smoke-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
          retention-days: 14
