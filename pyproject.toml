[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
tributo = { path = "../../Tributo", editable = true }
tributo-algorithms-boosting = { workspace = true }
tributo-algorithms-causal-core = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "Q", "C4", "W"]
ignore = ["E501", "B008", "B905"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 180
filterwarnings = ["error", "ignore::DeprecationWarning"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.0.2",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.0,<1.0",
]
