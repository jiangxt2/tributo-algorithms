[project]
name = "tributo-algorithms-causal-dr"
version = "0.1.0"
description = "Official distributed doubly robust causal estimators for Tributo"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "tributo>=1,<2",
    "tributo-algorithms-boosting==0.1.0",
    "tributo-algorithms-causal-core==0.1.0",
    "numpy>=2,<3",
    "xgboost>=2.1,<4",
]

[project.entry-points."tributo.algorithms"]
doubly_robust_ate = "tributo_algorithms_causal_dr.descriptor:DR_DESCRIPTOR"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributo_algorithms_causal_dr"]
