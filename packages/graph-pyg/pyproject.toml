[project]
name = "tributo-algorithms-graph-pyg"
version = "0.1.0"
description = "Official distributed PyG graph algorithms for Tributo"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "tributo[model-export-torch]>=1,<2",
    "onnx>=1.16",
    "onnxruntime>=1.20",
    "torch>=2.5",
    "torch-geometric>=2.5",
    "safetensors>=0.4.3",
]

[project.entry-points."tributo.algorithms"]
graphsage_node_classifier = "tributo_algorithms_graph_pyg.descriptor:GRAPHSAGE_DESCRIPTOR"
rgcn_node_classifier = "tributo_algorithms_graph_pyg.descriptor:RGCN_DESCRIPTOR"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributo_algorithms_graph_pyg"]
