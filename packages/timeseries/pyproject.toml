[project]
name = "tributo-algorithms-timeseries"
version = "0.1.0"
description = "Official distributed time-series algorithms for Tributo"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "tributo>=1,<2",
    "torch>=2.5",
    "onnx>=1.16",
    "onnxruntime>=1.20",
]

[project.entry-points."tributo.algorithms"]
temporal_conv_classifier = "tributo_algorithms_timeseries.descriptor:TEMPORAL_CONV_DESCRIPTOR"
lstm_classifier = "tributo_algorithms_timeseries.rnn_descriptor:LSTM_DESCRIPTOR"
gru_classifier = "tributo_algorithms_timeseries.rnn_descriptor:GRU_DESCRIPTOR"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributo_algorithms_timeseries"]
