[project]
name = "tributo-algorithms-causal-core"
version = "0.1.0"
description = "Official distributed causal estimators and causal artifacts for Tributo"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "tributo[model-export]>=1,<2",
    "numpy>=2,<3",
    "scikit-learn>=1.4,<2",
    "skl2onnx>=1.17",
]

[project.entry-points."tributo.algorithms"]
difference_in_means_ate = "tributo_algorithms_causal_core.descriptor:ATE_DESCRIPTOR"
linear_dml_ate = "tributo_algorithms_causal_core.descriptor:LINEAR_DML_DESCRIPTOR"
linear_iv_ate = "tributo_algorithms_causal_core.descriptor:LINEAR_IV_DESCRIPTOR"

[project.entry-points."tributo.exporters"]
official-causal-report-v1 = "tributo_algorithms_causal_core.exporter:OfficialCausalReportExporter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributo_algorithms_causal_core"]
