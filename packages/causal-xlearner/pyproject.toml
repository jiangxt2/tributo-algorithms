[project]
name = "tributo-algorithms-causal-xlearner"
version = "0.1.0"
description = "Official distributed X-Learner for Tributo"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "tributo>=1,<2",
    "tributo-algorithms-boosting==0.1.0",
    "xgboost>=2.1,<4",
    "numpy>=2,<3",
    "onnx>=1.16",
    "onnxmltools>=1.13",
    "onnxruntime>=1.20",
]

[project.entry-points."tributo.algorithms"]
"x_learner.framework_native" = "tributo_algorithms_causal_xlearner.descriptor:X_LEARNER_DESCRIPTOR"

[project.entry-points."tributo.exporters"]
official-x-learner-v1 = "tributo_algorithms_causal_xlearner.exporter:XLearnerExporter"
official-x-learner-onnx-v1 = "tributo_algorithms_causal_xlearner.exporter:XLearnerONNXExporter"
official-x-learner-report-v1 = "tributo_algorithms_causal_xlearner.exporter:XLearnerReportExporter"

[project.entry-points."tributo.model_flavors"]
official-x-learner-v1 = "tributo_algorithms_causal_xlearner.flavor:XLearnerFlavor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributo_algorithms_causal_xlearner"]
