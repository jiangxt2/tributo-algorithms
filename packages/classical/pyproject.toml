[project]
name = "tributo-algorithms-classical"
version = "0.1.0"
description = "Official distributed classical machine-learning algorithms for Tributo"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "tributo>=1,<2",
    "numpy>=2,<3",
    "scipy>=1.12,<2",
    "scikit-learn>=1.4,<2",
    "onnx>=1.16",
    "onnxruntime>=1.20",
    "skl2onnx>=1.17",
]

[project.entry-points."tributo.algorithms"]
"extra_trees.joblib" = "tributo_algorithms_classical.descriptors:EXTRA_TREES_JOBLIB_DESCRIPTOR"
"extra_trees.native" = "tributo_algorithms_classical.descriptors:EXTRA_TREES_NATIVE_DESCRIPTOR"
"linear_regression.iterative" = "tributo_algorithms_classical.descriptors:LINEAR_REGRESSION_DESCRIPTOR"
"random_forest.joblib" = "tributo_algorithms_classical.descriptors:RANDOM_FOREST_JOBLIB_DESCRIPTOR"
"random_forest.native" = "tributo_algorithms_classical.descriptors:RANDOM_FOREST_NATIVE_DESCRIPTOR"
"logistic_regression.iterative" = "tributo_algorithms_classical.descriptors:LOGISTIC_REGRESSION_DESCRIPTOR"
multinomial_nb = "tributo_algorithms_classical.multinomial_nb_descriptor:MULTINOMIAL_NB_DESCRIPTOR"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributo_algorithms_classical"]
