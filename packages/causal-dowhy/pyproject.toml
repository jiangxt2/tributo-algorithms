[project]
name = "tributo-algorithms-causal-dowhy"
version = "0.1.0"
description = "Official distributed DoWhy estimate and refutation adapters for Tributo"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "tributo>=1,<2",
    "tributo-algorithms-causal-core==0.1.0",
    "dowhy>=0.13,<0.15",
    "networkx>=3.0",
    "numpy>=2,<3",
]

[project.entry-points."tributo.algorithms"]
dowhy_linear_refutation = "tributo_algorithms_causal_dowhy.descriptor:DOWHY_DESCRIPTOR"
gcm_root_cause = "tributo_algorithms_causal_dowhy.gcm_descriptor:GCM_DESCRIPTOR"

[project.entry-points."tributo.exporters"]
official-causal-gcm-report-v1 = "tributo_algorithms_causal_dowhy.exporter:GCMReportExporter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributo_algorithms_causal_dowhy"]
