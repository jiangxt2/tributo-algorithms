[project]
name = "tributo-algorithms-tabular-torch"
version = "0.1.0"
description = "Official distributed tabular PyTorch algorithms for Tributo"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "tributo[model-export-torch]>=1,<2",
    "torch>=2.5",
]

[project.entry-points."tributo.algorithms"]
"dnn.recipe_v2" = "tributo_algorithms_tabular_torch.descriptor:DNN_DESCRIPTOR"
"pu.recipe_v2" = "tributo_algorithms_tabular_torch.descriptor:PU_DESCRIPTOR"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributo_algorithms_tabular_torch"]
