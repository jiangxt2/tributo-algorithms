x-runtime: &runtime
  image: ${TRIBUTO_E2E_IMAGE}
  pull_policy: never
  shm_size: 1gb
  volumes:
    - work:/e2e
    - ${TRIBUTO_E2E_EVIDENCE}/results:/e2e/evidence
    - ${TRIBUTO_E2E_REUSE_RESULTS:-${TRIBUTO_E2E_EVIDENCE}/results}:/opt/tributo-e2e/reuse:ro
    - ${TRIBUTO_E2E_JOB}:/opt/tributo-e2e/pytorch_e2e_job.py:ro
    - ${TRIBUTO_E2E_TESTS}:/opt/tributo-e2e/tests:ro
    - ${TRIBUTO_CORE_DIR}/tests:/opt/tributo-core-tests/tests:ro
    - ${TRIBUTO_CORE_DIR}/scripts:/opt/tributo-core-tests/scripts:ro
    - ${TRIBUTO_CORE_DIR}/ci:/opt/tributo-core-tests/ci:ro
    - ${TRIBUTO_CORE_DIR}/tools:/opt/tributo-core-tests/tools:ro
    - ${TRIBUTO_CORE_DIR}/pyproject.toml:/opt/tributo-core-tests/pyproject.toml:ro
    - ${TRIBUTO_CORE_DIR}/uv.lock:/opt/tributo-core-tests/uv.lock:ro
    - ${TRIBUTO_CORE_DIR}/src/tributo/_common/runtime_versions.json:/opt/tributo-core-tests/src/tributo/_common/runtime_versions.json:ro
  environment: &environment
    AWS_ACCESS_KEY_ID: ${TRIBUTO_E2E_ACCESS}
    AWS_SECRET_ACCESS_KEY: ${TRIBUTO_E2E_SECRET}
    AWS_DEFAULT_REGION: us-east-1
    AWS_ENDPOINT_URL: http://minio:9000
    MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    MLFLOW_TRACKING_URI: http://mlflow:5000
    TRIBUTO_EXPECTED_CORE: ${TRIBUTO_CORE_VERSION}
    TRIBUTO_EXPECTED_RAY: ${RAY_VERSION}
    TRIBUTO_EXPECTED_TORCH: ${TORCH_VERSION}
    TRIBUTO_E2E_REUSE_ENABLED: ${TRIBUTO_E2E_REUSE_ENABLED:-0}
    RAY_memory_usage_threshold: '0.90'
    RAY_DEDUP_LOGS: '0'

services:
  ray-head:
    <<: *runtime
    command: [bash, -c, 'ray start --head --port=6379 --dashboard-host=0.0.0.0 --num-cpus=0 --object-store-memory=536870912 --temp-dir=/tmp/ray-head --block']
    mem_limit: 8g
    cpus: 1
  ray-worker-a:
    <<: *runtime
    command: [bash, -c, 'ray start --address=ray-head:6379 --num-cpus=3 --object-store-memory=1073741824 --temp-dir=/tmp/ray-worker-a --block']
    mem_limit: 5g
    cpus: 3
    depends_on: [ray-head]
  ray-worker-b:
    <<: *runtime
    command: [bash, -c, 'ray start --address=ray-head:6379 --num-cpus=3 --object-store-memory=1073741824 --temp-dir=/tmp/ray-worker-b --block']
    mem_limit: 5g
    cpus: 3
    depends_on: [ray-head]
  minio:
    image: ${MINIO_IMAGE}
    pull_policy: never
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ${TRIBUTO_E2E_ACCESS}
      MINIO_ROOT_PASSWORD: ${TRIBUTO_E2E_SECRET}
    volumes: [minio:/data]
    mem_limit: 512m
    cpus: 0.5
  mlflow:
    <<: *runtime
    command: [bash, -c, 'mkdir -p /e2e/mlflow && exec mlflow server --host 0.0.0.0 --port 5000 --workers 1 --backend-store-uri sqlite:////e2e/mlflow/tracking.db --default-artifact-root /e2e/mlflow/artifacts']
    mem_limit: 1g
    cpus: 0.5

volumes:
  work:
  minio:
